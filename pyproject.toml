[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limitless-meta"
version = "0.1.0"
description = "Descriptive analytics for Limitless PTCGL online tournaments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "altair>=5.0.0,<7",
  "duckdb>=1.1.0",
  "pandas>=2.1.0",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
limitless-meta = "limitless_meta.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
